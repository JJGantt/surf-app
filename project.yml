name: Gnarcast
options:
  bundleIdPrefix: com.jaredgantt
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XMH4AVFC78
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  # The iPhone app: signs in once with the hub password, then shows the hub's /surf page.
  Gnarcast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gnarcast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # HTTPS only — exempt. Undeclared, TestFlight holds every upload at "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.surf
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GnarcastWatch
        embed: true
  # The watch app: the live readings, read straight from the hub with the token the phone hands over.
  GnarcastWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Gnarcast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaredgantt.surf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.surf.watchkitapp
        PRODUCT_NAME: GnarcastWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: GnarcastWatchWidgets
        embed: true
  # ONE EXTENSION, TWO SURFACES. A ControlWidget reaches Control Center, the Smart Stack and an
  # Ultra's Action button; a complication reaches the watch face. They are different APIs with
  # different limits — a control is a system-drawn Label and a complication is a view of our own —
  # but they ship in the same widget extension, so this is one target and one bundle id for both.
  GnarcastWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
      - path: Shared
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gnarcast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.surf.watchkitapp.widgets
        PRODUCT_NAME: GnarcastWatchWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
